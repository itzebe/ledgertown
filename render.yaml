# Render Blueprint for Ledgertown — free-tier public deployment.
#
# Docs: https://render.com/docs/blueprint-spec
#
# The service runs the Node play server in READ-ONLY mode by default: it serves
# the UI and reads live NEAR testnet contract state over public RPC, holding no
# signing keys. That is enough for judges to inspect genuine on-chain economic
# state with no credentials.
#
# To enable bounded, non-owner play actions, set these in the Render dashboard
# (Environment) and flip LEDGERTOWN_MODE to "play":
#   LEDGERTOWN_DEMO_ACCOUNT  — a dedicated testnet account id
#   LEDGERTOWN_DEMO_KEY      — its secret key (marked sync:false, never committed)
# `deposit` and every owner-only method stay unreachable regardless.
services:
  - type: web
    name: ledgertown
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node web/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: "0.0.0.0"
      - key: LEDGERTOWN_MODE
        value: "read-only"
      - key: LEDGERTOWN_CONTRACT
        value: "town.ledgertown.testnet"
      - key: LEDGERTOWN_RPC
        value: "https://rpc.testnet.fastnear.com,https://near-testnet.drpc.org,https://rpc.testnet.near.org"
      # Optional CORS allowlist (comma-separated). Empty = same-origin only.
      - key: LEDGERTOWN_ALLOW_ORIGIN
        value: ""
      # Play mode secrets: set values in the dashboard, never in git.
      - key: LEDGERTOWN_DEMO_ACCOUNT
        sync: false
      - key: LEDGERTOWN_DEMO_KEY
        sync: false
